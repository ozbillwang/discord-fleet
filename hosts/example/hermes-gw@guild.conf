[Service]
User=bxadmin
Group=bxadmin
EnvironmentFile=/etc/builderxai/secrets/llm-guild.env
EnvironmentFile=/etc/builderxai/secrets/guild.env
# same token under a name Hermes does not strip from terminal children (DISCORD_BOT_TOKEN is always stripped)
EnvironmentFile=/etc/builderxai/secrets/guild-rest.env
# web search/fetch token (BX_WEB_CLIENT_TOKEN; Hermes doesn't strip this name from terminal children)
EnvironmentFile=/etc/builderxai/secrets/web.env
# Guild's local bx-llm-gw client key (BX_LLM_GW_KEY) for the image-gen skill; a name Hermes doesn't strip
EnvironmentFile=/etc/builderxai/secrets/llm-guild-gw.env
EnvironmentFile=/etc/builderxai/secrets/github.env
EnvironmentFile=/etc/builderxai/secrets/email.env
Environment=DISCORD_ALLOWED_USERS=<owner discord id>
# staging for Bot User runtime config (botctl apply reads it)
ReadWritePaths=/home/bxadmin /srv/builderxai/shared /srv/builderxai/bots
ExecStart=/home/bxadmin/.local/bin/hermes gateway run --replace
