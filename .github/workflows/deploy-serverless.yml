name: Deploy Discord Fleet Serverless

on:
  push:
    branches:
      - feature/serverless
    paths:
      - 'serverless/**'
      - '.github/workflows/deploy-serverless.yml'
  workflow_dispatch:

env:
  AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Python code
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Check Python syntax
        run: |
          python -m py_compile serverless/lambda/llm_provider.py
          echo "✅ Python syntax validation passed"

      - name: Validate file structure
        run: |
          echo "Checking serverless directory structure..."
          test -f serverless/00_START_HERE.md || (echo "❌ Missing 00_START_HERE.md" && exit 1)
          test -d serverless/docs || (echo "❌ Missing docs directory" && exit 1)
          test -d serverless/lambda || (echo "❌ Missing lambda directory" && exit 1)
          test -f serverless/lambda/llm_provider.py || (echo "❌ Missing llm_provider.py" && exit 1)
          echo "✅ File structure validation passed"

  build-lambda-layer:
    name: Build Lambda Layer (Dependencies)
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          mkdir -p lambda_layer/python
          cd lambda_layer/python
          
          # Install required packages
          pip install \
            anthropic==0.7.1 \
            openai==1.3.5 \
            requests==2.31.0 \
            boto3==1.28.0 \
            -t .
          
          cd ../..
          echo "✅ Dependencies installed"

      - name: Create layer zip
        run: |
          cd lambda_layer
          zip -r ../lambda-layer.zip .
          cd ..
          ls -lh lambda-layer.zip
          echo "✅ Lambda layer created"

      - name: Upload layer artifact
        uses: actions/upload-artifact@v3
        with:
          name: lambda-layer
          path: lambda-layer.zip
          retention-days: 1

  package-lambda-functions:
    name: Package Lambda Functions
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create lambda packages
        run: |
          mkdir -p lambda_packages
          
          # Package llm_provider.py
          cp serverless/lambda/llm_provider.py lambda_packages/
          
          # Create placeholder Lambda functions
          echo "Creating message_handler..."
          mkdir -p lambda_packages/message_handler
          cat > lambda_packages/message_handler/lambda_function.py << 'EOF'
          """Discord message handler Lambda function"""
          
          import json
          import boto3
          import os
          from datetime import datetime
          
          dynamodb = boto3.resource('dynamodb')
          lambda_client = boto3.client('lambda')
          
          
          def lambda_handler(event, context):
              """
              Route Discord messages to appropriate agent
              
              Event format:
              {
                  "channel_id": "123456789",
                  "message": "user message",
                  "user_id": "987654321",
                  "thread_id": "thread_123"
              }
              """
              
              try:
                  channel_id = event.get('channel_id')
                  message = event.get('message')
                  user_id = event.get('user_id')
                  thread_id = event.get('thread_id')
                  
                  # Get channel binding from DynamoDB
                  bindings_table = dynamodb.Table(os.environ['BINDINGS_TABLE'])
                  
                  binding_response = bindings_table.get_item(
                      Key={'channel_id': channel_id}
                  )
                  
                  if 'Item' not in binding_response:
                      return {
                          'statusCode': 404,
                          'body': json.dumps({'error': 'Channel not bound'})
                      }
                  
                  binding = binding_response['Item']
                  agent_id = binding['agent_id']
                  
                  # Invoke omp_agent_handler
                  response = lambda_client.invoke(
                      FunctionName=os.environ['OMP_AGENT_HANDLER'],
                      InvocationType='RequestResponse',
                      Payload=json.dumps({
                          'agent_id': agent_id,
                          'message': message,
                          'thread_id': thread_id,
                          'user_id': user_id,
                          'channel_id': channel_id
                      })
                  )
                  
                  reply_payload = json.loads(response['Payload'].read())
                  
                  return {
                      'statusCode': 200,
                      'body': json.dumps({
                          'reply': reply_payload.get('reply'),
                          'agent_id': agent_id
                      })
                  }
                  
              except Exception as e:
                  print(f"Error: {str(e)}")
                  return {
                      'statusCode': 500,
                      'body': json.dumps({'error': str(e)})
                  }
          EOF
          
          echo "Creating omp_agent_handler..."
          mkdir -p lambda_packages/omp_agent_handler
          cat > lambda_packages/omp_agent_handler/lambda_function.py << 'EOF'
          """OMP Agent Handler - Process messages with LLM"""
          
          import json
          import boto3
          import os
          import sys
          
          # Import llm_provider from layer
          sys.path.insert(0, '/opt/python')
          from llm_provider import LLMFactory, LLMMessage
          
          dynamodb = boto3.resource('dynamodb')
          
          
          def lambda_handler(event, context):
              """
              Process message with LLM agent
              
              Event format:
              {
                  "agent_id": "writing-assistant",
                  "message": "user message",
                  "thread_id": "thread_123",
                  "user_id": "987654321",
                  "channel_id": "123456789"
              }
              """
              
              try:
                  agent_id = event.get('agent_id')
                  message = event.get('message')
                  thread_id = event.get('thread_id')
                  
                  # Get agent configuration
                  agents_table = dynamodb.Table(os.environ['AGENTS_TABLE'])
                  
                  agent_response = agents_table.get_item(
                      Key={'agent_id': agent_id}
                  )
                  
                  if 'Item' not in agent_response:
                      return {'statusCode': 404, 'error': 'Agent not found'}
                  
                  agent_config = agent_response['Item']
                  system_prompt = agent_config.get('system_prompt', '')
                  llm_provider = agent_config.get('llm_provider', 'claude')
                  llm_model = agent_config.get('llm_model', 'claude-3-5-sonnet-20241022')
                  
                  # Get LLM client
                  api_key = os.environ.get('LLM_API_KEY')
                  llm = LLMFactory.create(
                      llm_provider,
                      api_key=api_key,
                      model=llm_model
                  )
                  
                  # Get conversation history
                  sessions_table = dynamodb.Table(os.environ['SESSIONS_TABLE'])
                  
                  session_response = sessions_table.get_item(
                      Key={'thread_id': thread_id, 'agent_id': agent_id}
                  )
                  
                  messages = []
                  if 'Item' in session_response:
                      messages = [
                          LLMMessage(role=m['role'], content=m['content'])
                          for m in session_response['Item'].get('messages', [])
                      ]
                  
                  # Call LLM
                  reply = llm.send_message(
                      messages=messages + [LLMMessage(role='user', content=message)],
                      system_prompt=system_prompt,
                      temperature=float(agent_config.get('temperature', 0.7)),
                      max_tokens=int(agent_config.get('max_tokens', 1024))
                  )
                  
                  # Save to session history
                  new_messages = messages + [
                      LLMMessage(role='user', content=message),
                      LLMMessage(role='assistant', content=reply)
                  ]
                  
                  sessions_table.put_item(
                      Item={
                          'thread_id': thread_id,
                          'agent_id': agent_id,
                          'messages': [m.to_dict() for m in new_messages],
                          'updated_at': int(time.time())
                      }
                  )
                  
                  return {
                      'statusCode': 200,
                      'reply': reply,
                      'llm_provider': llm_provider,
                      'llm_model': llm_model
                  }
                  
              except Exception as e:
                  print(f"Error: {str(e)}")
                  import traceback
                  traceback.print_exc()
                  return {
                      'statusCode': 500,
                      'error': str(e)
                  }
          EOF
          
          zip -r ../lambda-functions.zip .
          cd ..
          ls -lh lambda-functions.zip
          echo "✅ Lambda functions packaged"

      - name: Upload functions artifact
        uses: actions/upload-artifact@v3
        with:
          name: lambda-functions
          path: lambda-functions.zip
          retention-days: 1

  deploy-to-aws:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: [build-lambda-layer, package-lambda-functions]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Extract artifacts
        run: |
          cd artifacts
          unzip -q lambda-layer/lambda-layer.zip -d ../lambda_layer_extracted
          unzip -q lambda-functions/lambda-functions.zip -d ../lambda_functions_extracted
          cd ..
          echo "✅ Artifacts extracted"

      - name: Set up AWS CLI
        run: |
          echo "AWS Region: ${{ env.AWS_DEFAULT_REGION }}"
          echo "Checking AWS credentials..."
          aws sts get-caller-identity
          echo "✅ AWS credentials verified"

      - name: Create S3 bucket for artifacts
        run: |
          BUCKET_NAME="discord-fleet-serverless-$(date +%s)"
          
          # Check if bucket exists
          if ! aws s3 ls "s3://${BUCKET_NAME}" 2>/dev/null; then
            echo "Creating S3 bucket: ${BUCKET_NAME}"
            aws s3 mb "s3://${BUCKET_NAME}" --region "${{ env.AWS_DEFAULT_REGION }}"
          fi
          
          # Upload lambda layer
          echo "Uploading Lambda layer..."
          aws s3 cp artifacts/lambda-layer/lambda-layer.zip "s3://${BUCKET_NAME}/lambda-layer.zip"
          
          # Upload lambda functions
          echo "Uploading Lambda functions..."
          aws s3 cp artifacts/lambda-functions/lambda-functions.zip "s3://${BUCKET_NAME}/lambda-functions.zip"
          
          echo "LAMBDA_LAYER_S3_KEY=s3://${BUCKET_NAME}/lambda-layer.zip" >> $GITHUB_ENV
          echo "LAMBDA_FUNCTIONS_S3_KEY=s3://${BUCKET_NAME}/lambda-functions.zip" >> $GITHUB_ENV
          echo "BUCKET_NAME=${BUCKET_NAME}" >> $GITHUB_ENV

      - name: Create Lambda Layer
        run: |
          echo "Creating Lambda layer..."
          LAYER_VERSION=$(aws lambda publish-layer-version \
            --layer-name "discord-fleet-dependencies" \
            --zip-file "fileb://artifacts/lambda-layer/lambda-layer.zip" \
            --compatible-runtimes python3.11 \
            --query 'Version' \
            --output text)
          
          echo "Layer version: ${LAYER_VERSION}"
          echo "LAYER_VERSION=${LAYER_VERSION}" >> $GITHUB_ENV

      - name: Create DynamoDB Tables
        run: |
          echo "Creating DynamoDB tables..."
          
          # Sessions table
          aws dynamodb create-table \
            --table-name discord-fleet-sessions \
            --attribute-definitions \
              AttributeName=thread_id,AttributeType=S \
              AttributeName=agent_id,AttributeType=S \
            --key-schema \
              AttributeName=thread_id,KeyType=HASH \
              AttributeName=agent_id,KeyType=RANGE \
            --billing-mode PAY_PER_REQUEST \
            --region ${{ env.AWS_DEFAULT_REGION }} || echo "Table already exists"
          
          # Bindings table
          aws dynamodb create-table \
            --table-name discord-fleet-bindings \
            --attribute-definitions \
              AttributeName=channel_id,AttributeType=S \
            --key-schema \
              AttributeName=channel_id,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --region ${{ env.AWS_DEFAULT_REGION }} || echo "Table already exists"
          
          # Agents table
          aws dynamodb create-table \
            --table-name discord-fleet-agents \
            --attribute-definitions \
              AttributeName=agent_id,AttributeType=S \
            --key-schema \
              AttributeName=agent_id,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --region ${{ env.AWS_DEFAULT_REGION }} || echo "Table already exists"
          
          echo "✅ DynamoDB tables ready"

      - name: Create Lambda Functions
        run: |
          echo "Creating message_handler Lambda function..."
          aws lambda create-function \
            --function-name discord-fleet-message-handler \
            --runtime python3.11 \
            --role arn:aws:iam::$(aws sts get-caller-identity --query Account --output text):role/lambda-execution-role \
            --handler lambda_function.lambda_handler \
            --zip-file fileb://lambda_functions_extracted/message_handler/lambda_function.py \
            --layers arn:aws:lambda:${{ env.AWS_DEFAULT_REGION }}:$(aws sts get-caller-identity --query Account --output text):layer:discord-fleet-dependencies:${LAYER_VERSION} \
            --environment Variables="{OMP_AGENT_HANDLER=discord-fleet-omp-agent-handler,BINDINGS_TABLE=discord-fleet-bindings}" \
            --region ${{ env.AWS_DEFAULT_REGION }} 2>/dev/null || echo "Function already exists"
          
          echo "Creating omp_agent_handler Lambda function..."
          aws lambda create-function \
            --function-name discord-fleet-omp-agent-handler \
            --runtime python3.11 \
            --role arn:aws:iam::$(aws sts get-caller-identity --query Account --output text):role/lambda-execution-role \
            --handler lambda_function.lambda_handler \
            --zip-file fileb://lambda_functions_extracted/omp_agent_handler/lambda_function.py \
            --layers arn:aws:lambda:${{ env.AWS_DEFAULT_REGION }}:$(aws sts get-caller-identity --query Account --output text):layer:discord-fleet-dependencies:${LAYER_VERSION} \
            --environment Variables="{AGENTS_TABLE=discord-fleet-agents,SESSIONS_TABLE=discord-fleet-sessions,LLM_API_KEY=${{ secrets.CLAUDE_API_KEY }}}" \
            --region ${{ env.AWS_DEFAULT_REGION }} 2>/dev/null || echo "Function already exists"
          
          echo "✅ Lambda functions created"

      - name: Deployment Summary
        run: |
          echo "================================"
          echo "✅ Deployment Successful!"
          echo "================================"
          echo ""
          echo "AWS Region: ${{ env.AWS_DEFAULT_REGION }}"
          echo "Lambda Layer Version: ${LAYER_VERSION}"
          echo "Functions Created:"
          echo "  - discord-fleet-message-handler"
          echo "  - discord-fleet-omp-agent-handler"
          echo "DynamoDB Tables:"
          echo "  - discord-fleet-sessions"
          echo "  - discord-fleet-bindings"
          echo "  - discord-fleet-agents"
          echo ""
          echo "S3 Bucket: ${{ env.BUCKET_NAME }}"
          echo ""
          echo "Next steps:"
          echo "1. Create API Gateway endpoint pointing to message_handler"
          echo "2. Add Discord bot tokens to Secrets Manager"
          echo "3. Configure Discord webhook"
          echo "4. Test message routing"

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: deploy-to-aws
    if: always()
    
    steps:
      - name: Deployment completed
        run: |
          if [ "${{ needs.deploy-to-aws.result }}" == "success" ]; then
            echo "✅ All deployments completed successfully!"
            echo "Lambda functions are now live in AWS"
          else
            echo "❌ Deployment failed. Check logs above."
            exit 1
          fi
