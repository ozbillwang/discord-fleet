name: Deploy Discord Fleet Serverless

on:
  push:
    branches:
      - feature/serverless
    paths:
      - 'serverless/**'
      - '.github/workflows/deploy-serverless.yml'
  workflow_dispatch:

env:
  AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
  PYTHON_VERSION: '3.11'

jobs:
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Check Python syntax
        run: |
          python -m py_compile serverless/lambda/llm_provider.py
          echo "✅ Python syntax validation passed"

      - name: Validate file structure
        run: |
          echo "Checking serverless directory structure..."
          test -f serverless/00_START_HERE.md || (echo "❌ Missing 00_START_HERE.md" && exit 1)
          test -d serverless/docs || (echo "❌ Missing docs directory" && exit 1)
          test -d serverless/lambda || (echo "❌ Missing lambda directory" && exit 1)
          test -f serverless/lambda/llm_provider.py || (echo "❌ Missing llm_provider.py" && exit 1)
          echo "✅ File structure validation passed"

  build-lambda-layer:
    name: Build Lambda Layer (Dependencies)
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          mkdir -p lambda_layer/python
          cd lambda_layer/python
          
          # Install required packages
          pip install \
            anthropic==0.7.1 \
            openai==1.3.5 \
            requests==2.31.0 \
            boto3==1.28.0 \
            -t .
          
          cd ../..
          echo "✅ Dependencies installed"

      - name: Create layer zip
        run: |
          cd lambda_layer
          zip -r ../lambda-layer.zip .
          cd ..
          ls -lh lambda-layer.zip
          echo "✅ Lambda layer created"

      - name: Upload layer artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-layer
          path: lambda-layer.zip
          retention-days: 1

  package-lambda-functions:
    name: Package Lambda Functions
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create lambda packages directory
        run: mkdir -p lambda_packages

      - name: Copy llm_provider
        run: cp serverless/lambda/llm_provider.py lambda_packages/

      - name: Create message_handler function
        run: |
          mkdir -p lambda_packages/message_handler
          cat > lambda_packages/message_handler/lambda_function.py << 'EOFPYTHON'
          import json
          import boto3
          import os
          
          dynamodb = boto3.resource('dynamodb')
          lambda_client = boto3.client('lambda')
          
          def lambda_handler(event, context):
              try:
                  channel_id = event.get('channel_id')
                  message = event.get('message')
                  thread_id = event.get('thread_id')
                  
                  # Get channel binding from DynamoDB
                  bindings_table = dynamodb.Table(os.environ.get('BINDINGS_TABLE', 'discord-fleet-bindings'))
                  
                  binding_response = bindings_table.get_item(Key={'channel_id': channel_id})
                  
                  if 'Item' not in binding_response:
                      return {
                          'statusCode': 404,
                          'body': json.dumps({'error': 'Channel not bound'})
                      }
                  
                  binding = binding_response['Item']
                  agent_id = binding['agent_id']
                  
                  # Invoke omp_agent_handler
                  response = lambda_client.invoke(
                      FunctionName=os.environ.get('OMP_AGENT_HANDLER', 'discord-fleet-omp-agent-handler'),
                      InvocationType='RequestResponse',
                      Payload=json.dumps({
                          'agent_id': agent_id,
                          'message': message,
                          'thread_id': thread_id,
                          'channel_id': channel_id
                      })
                  )
                  
                  reply_payload = json.loads(response['Payload'].read())
                  
                  return {
                      'statusCode': 200,
                      'body': json.dumps({
                          'reply': reply_payload.get('reply'),
                          'agent_id': agent_id
                      })
                  }
              except Exception as e:
                  print(f"Error: {str(e)}")
                  return {
                      'statusCode': 500,
                      'body': json.dumps({'error': str(e)})
                  }
          EOFPYTHON
          echo "✅ message_handler created"

      - name: Create omp_agent_handler function
        run: |
          mkdir -p lambda_packages/omp_agent_handler
          cat > lambda_packages/omp_agent_handler/lambda_function.py << 'EOFPYTHON'
          import json
          import boto3
          import os
          import time
          
          dynamodb = boto3.resource('dynamodb')
          
          def lambda_handler(event, context):
              try:
                  agent_id = event.get('agent_id')
                  message = event.get('message')
                  thread_id = event.get('thread_id')
                  
                  # Get agent configuration
                  agents_table = dynamodb.Table(os.environ.get('AGENTS_TABLE', 'discord-fleet-agents'))
                  
                  agent_response = agents_table.get_item(Key={'agent_id': agent_id})
                  
                  if 'Item' not in agent_response:
                      return {'statusCode': 404, 'error': 'Agent not found'}
                  
                  agent_config = agent_response['Item']
                  system_prompt = agent_config.get('system_prompt', '')
                  
                  # Get conversation history
                  sessions_table = dynamodb.Table(os.environ.get('SESSIONS_TABLE', 'discord-fleet-sessions'))
                  
                  session_response = sessions_table.get_item(
                      Key={'thread_id': thread_id, 'agent_id': agent_id}
                  )
                  
                  messages = []
                  if 'Item' in session_response:
                      messages = session_response['Item'].get('messages', [])
                  
                  # For now, return a simple placeholder reply
                  reply = f"Echo from {agent_id}: {message}"
                  
                  # Save to session history
                  new_messages = messages + [
                      {'role': 'user', 'content': message},
                      {'role': 'assistant', 'content': reply}
                  ]
                  
                  sessions_table.put_item(
                      Item={
                          'thread_id': thread_id,
                          'agent_id': agent_id,
                          'messages': new_messages,
                          'updated_at': int(time.time())
                      }
                  )
                  
                  return {
                      'statusCode': 200,
                      'reply': reply,
                      'agent_id': agent_id
                  }
              except Exception as e:
                  print(f"Error: {str(e)}")
                  import traceback
                  traceback.print_exc()
                  return {
                      'statusCode': 500,
                      'error': str(e)
                  }
          EOFPYTHON
          echo "✅ omp_agent_handler created"

      - name: Create deployment package
        run: |
          cd lambda_packages
          zip -r ../lambda-functions.zip .
          cd ..
          ls -lh lambda-functions.zip
          echo "✅ Lambda functions packaged"

      - name: Upload functions artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-functions
          path: lambda-functions.zip
          retention-days: 1

  deploy-to-aws:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: [build-lambda-layer, package-lambda-functions]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Verify AWS credentials
        run: |
          echo "Verifying AWS credentials..."
          aws sts get-caller-identity
          echo "✅ AWS credentials verified"

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create DynamoDB Tables
        run: |
          echo "Creating DynamoDB tables..."
          
          # Sessions table
          aws dynamodb create-table \
            --table-name discord-fleet-sessions \
            --attribute-definitions \
              AttributeName=thread_id,AttributeType=S \
              AttributeName=agent_id,AttributeType=S \
            --key-schema \
              AttributeName=thread_id,KeyType=HASH \
              AttributeName=agent_id,KeyType=RANGE \
            --billing-mode PAY_PER_REQUEST \
            --region ${{ env.AWS_DEFAULT_REGION }} 2>/dev/null || echo "✓ Sessions table exists"
          
          # Bindings table
          aws dynamodb create-table \
            --table-name discord-fleet-bindings \
            --attribute-definitions \
              AttributeName=channel_id,AttributeType=S \
            --key-schema \
              AttributeName=channel_id,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --region ${{ env.AWS_DEFAULT_REGION }} 2>/dev/null || echo "✓ Bindings table exists"
          
          # Agents table
          aws dynamodb create-table \
            --table-name discord-fleet-agents \
            --attribute-definitions \
              AttributeName=agent_id,AttributeType=S \
            --key-schema \
              AttributeName=agent_id,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --region ${{ env.AWS_DEFAULT_REGION }} 2>/dev/null || echo "✓ Agents table exists"
          
          echo "✅ DynamoDB tables ready"

      - name: Create or update Lambda functions
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/lambda-execution-role"
          
          echo "AWS Account ID: ${ACCOUNT_ID}"
          echo "Role ARN: ${ROLE_ARN}"
          
          # Check if role exists
          if ! aws iam get-role --role-name lambda-execution-role 2>/dev/null; then
            echo "⚠️  Warning: lambda-execution-role does not exist"
            echo "Please run the 'Setup IAM Role' workflow first"
            exit 1
          fi
          
          echo "✅ IAM role found"

      - name: Deployment Summary
        run: |
          echo "================================"
          echo "✅ Deployment Step Completed!"
          echo "================================"
          echo ""
          echo "AWS Region: ${{ env.AWS_DEFAULT_REGION }}"
          echo "DynamoDB Tables:"
          echo "  - discord-fleet-sessions"
          echo "  - discord-fleet-bindings"
          echo "  - discord-fleet-agents"
          echo ""
          echo "Next Steps:"
          echo "1. Run 'Setup IAM Role' workflow if not done yet"
          echo "2. Create Lambda functions via AWS CLI or Console"
          echo "3. Add Discord bot tokens to Secrets Manager"
          echo "4. Configure Discord webhook"

  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: deploy-to-aws
    if: always()
    
    steps:
      - name: Report deployment status
        run: |
          if [ "${{ needs.deploy-to-aws.result }}" == "success" ]; then
            echo "✅ Infrastructure setup completed successfully!"
          else
            echo "⚠️  Deployment encountered issues. Check logs above."
          fi
