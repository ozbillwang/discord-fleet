name: Setup IAM Role for Lambda Execution

on:
  workflow_dispatch:
    inputs:
      aws_account_id:
        description: 'AWS Account ID'
        required: true
        type: string

env:
  AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}

jobs:
  setup-iam:
    name: Create Lambda Execution Role
    runs-on: ubuntu-latest
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Get AWS Account ID
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "AWS Account ID: ${ACCOUNT_ID}"
          echo "ACCOUNT_ID=${ACCOUNT_ID}" >> $GITHUB_ENV

      - name: Create Lambda Execution Role
        run: |
          ROLE_NAME="lambda-execution-role"
          
          # Check if role exists
          if aws iam get-role --role-name ${ROLE_NAME} 2>/dev/null; then
            echo "Role ${ROLE_NAME} already exists"
          else
            echo "Creating role ${ROLE_NAME}..."
            
            # Create trust policy
            cat > trust-policy.json << 'EOF'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": {
                  "Service": "lambda.amazonaws.com"
                },
                "Action": "sts:AssumeRole"
              }
            ]
          }
          EOF
            
            # Create role
            aws iam create-role \
              --role-name ${ROLE_NAME} \
              --assume-role-policy-document file://trust-policy.json
            
            echo "✅ Role created"
          fi

      - name: Attach DynamoDB Policy
        run: |
          ROLE_NAME="lambda-execution-role"
          POLICY_NAME="dynamodb-policy"
          
          # Create policy
          cat > dynamodb-policy.json << 'EOF'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "dynamodb:GetItem",
                  "dynamodb:PutItem",
                  "dynamodb:Query",
                  "dynamodb:UpdateItem"
                ],
                "Resource": "arn:aws:dynamodb:*:*:table/discord-fleet-*"
              }
            ]
          }
          EOF
          
          # Attach policy
          aws iam put-role-policy \
            --role-name ${ROLE_NAME} \
            --policy-name ${POLICY_NAME} \
            --policy-document file://dynamodb-policy.json
          
          echo "✅ DynamoDB policy attached"

      - name: Attach Lambda Invoke Policy
        run: |
          ROLE_NAME="lambda-execution-role"
          POLICY_NAME="lambda-invoke-policy"
          
          # Create policy
          cat > lambda-policy.json << 'EOF'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "lambda:InvokeFunction"
                ],
                "Resource": "arn:aws:lambda:*:*:function:discord-fleet-*"
              }
            ]
          }
          EOF
          
          # Attach policy
          aws iam put-role-policy \
            --role-name ${ROLE_NAME} \
            --policy-name ${POLICY_NAME} \
            --policy-document file://lambda-policy.json
          
          echo "✅ Lambda invoke policy attached"

      - name: Attach CloudWatch Logs Policy
        run: |
          ROLE_NAME="lambda-execution-role"
          
          # Attach AWS managed policy
          aws iam attach-role-policy \
            --role-name ${ROLE_NAME} \
            --policy-arn arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
          
          echo "✅ CloudWatch Logs policy attached"

      - name: Attach Secrets Manager Policy
        run: |
          ROLE_NAME="lambda-execution-role"
          POLICY_NAME="secrets-manager-policy"
          
          # Create policy
          cat > secrets-policy.json << 'EOF'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "secretsmanager:GetSecretValue"
                ],
                "Resource": "arn:aws:secretsmanager:*:*:secret:discord-fleet/*"
              }
            ]
          }
          EOF
          
          # Attach policy
          aws iam put-role-policy \
            --role-name ${ROLE_NAME} \
            --policy-name ${POLICY_NAME} \
            --policy-document file://secrets-policy.json
          
          echo "✅ Secrets Manager policy attached"

      - name: Summary
        run: |
          ROLE_NAME="lambda-execution-role"
          ROLE_ARN=$(aws iam get-role --role-name ${ROLE_NAME} --query 'Role.Arn' --output text)
          
          echo "================================"
          echo "✅ IAM Role Setup Complete"
          echo "================================"
          echo ""
          echo "Role Name: ${ROLE_NAME}"
          echo "Role ARN: ${ROLE_ARN}"
          echo ""
          echo "Attached Policies:"
          echo "  - DynamoDB access"
          echo "  - Lambda invoke"
          echo "  - CloudWatch Logs"
          echo "  - Secrets Manager"
          echo ""
          echo "This role is ready for Lambda functions!"
