# /data/omp-agent/models.yml — shared by all agents of one Bot User (PI_CODING_AGENT_DIR=/data/omp-agent)
# apiKey is the NAME of an env var; omp resolves it at runtime (config/resolve-config-value.ts).
providers:
  bx:
    baseUrl: http://10.0.2.2:18080/v1     # H8 proxy, as seen from the rootless container
    apiKey: CLIAPI_API_KEY
    api: openai-completions
    models:
      - id: gemini-3.8-flash-high
        reasoning: true
        input: [text, image]
        contextWindow: 1048576
        maxTokens: 8192
      - id: gemini-3.6-flash
        reasoning: true
        input: [text, image]
        contextWindow: 1048576
        maxTokens: 8192
